[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-background-removal"
version = "0.2.0"
description = "Agent-driven local CPU background removal for game-art references"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AI Generation Orchestrators contributors"}]
dependencies = [
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
segmentation = [
  "onnxruntime==1.29.0; python_version == '3.14'",
  "numpy==2.5.2; python_version == '3.14'",
  "scipy==1.18.1; python_version == '3.14'",
  "numba==0.67.0; python_version == '3.14'",
  "llvmlite==0.49.0; python_version == '3.14'",
  "onnxruntime>=1.20,<2; python_version < '3.14'",
  "scipy>=1.11,<2; python_version < '3.14'",
  "PyMatting==1.1.15",
]
test = ["scipy>=1.11,<2"]

[project.scripts]
ai-image-background-removal = "ai_image_background_removal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
