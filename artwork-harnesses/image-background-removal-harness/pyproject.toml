[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-background-removal"
version = "0.4.0"
description = "Agent-driven fal BiRefNet V2 background removal for game-art references"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AI Generation Orchestrators contributors"}]
dependencies = [
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "fal-client==1.0.1",
]

[project.optional-dependencies]
test = ["scipy>=1.11,<2"]

[project.scripts]
ai-image-background-removal = "ai_image_background_removal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
