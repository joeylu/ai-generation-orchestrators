<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 图层查看器</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#24334a;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;font-size:13px;border:1px solid #d8e0e9;border-radius:6px;padding:8px 12px;background:white;color:inherit;cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){background:#edf4ff}header{background:white;border-bottom:1px solid #dce3ec;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:19px;margin:0 0 5px}p{margin:0;color:#69778b;font-size:12px}#open{background:#245edb;color:white;border:0}main{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 86px)}aside{background:#fff;border-right:1px solid #dce3ec;overflow:auto;padding:20px 15px}h2{font-size:13px;margin:0 0 14px}#layers{display:grid;gap:5px}.layer{padding:9px 5px;border-bottom:1px solid #edf0f5;display:grid;grid-template-columns:20px 1fr auto;gap:7px;align-items:center}.layer label{font-size:12px;overflow-wrap:anywhere}.layer button{font-size:11px;padding:4px 6px}.layer button[aria-pressed=true]{color:#245edb;background:#eaf0ff}.surface{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #dce3ec}.toolbar label{font-size:12px}#zoom{width:100px}#stage{position:relative;flex:1;min-height:300px;overflow:hidden;background-color:#f2f4f7;background-image:linear-gradient(45deg,#e6eaf0 25%,transparent 25%),linear-gradient(-45deg,#e6eaf0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6eaf0 75%),linear-gradient(-45deg,transparent 75%,#e6eaf0 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{display:block;touch-action:none;cursor:grab}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;pointer-events:none}#empty strong{font-size:18px;font-weight:500}#status{padding:12px 18px;font-size:12px;background:white;border-top:1px solid #dce3ec;overflow-wrap:anywhere}#issues{padding:12px 18px;background:#fff8e9;font-size:12px;line-height:1.6;max-height:115px;overflow:auto}#issues p{color:#795e26}#error{padding:12px 18px;background:#fff0f0;color:#b32a3e;font-size:13px;white-space:pre-wrap}#summary{font-size:12px;line-height:1.8;margin-bottom:20px;color:#69778b}[hidden]{display:none!important}@media(max-width:700px){header{padding:14px}main{grid-template-columns:1fr;height:auto}aside{order:2;max-height:300px;border-top:1px solid #dce3ec}.surface{min-height:65vh}.toolbar{padding:10px}#stage{height:45vh;flex:auto}}
</style></head><body>
<header><div><h1>UI 图层查看器</h1><p>查看拆分图层、对照原图，所有文件只在本地处理。</p></div><button id="open">打开拆分包 ZIP</button><input id="file" type="file" accept=".zip" hidden></header>
<main><aside><h2>图层</h2><div id="summary">尚未打开拆分包</div><div id="layers"></div></aside><section class="surface">
<div class="toolbar"><label>查看 <select id="mode" disabled><option value="composite">回拼</option><option value="reference">原图</option><option value="overlay">叠加对照</option></select></label><button id="fit" disabled>适应画布</button><label>缩放 <input id="zoom" type="range" min="10" max="200" value="100" disabled></label><output id="zoom-value">100%</output><button id="download-layer" disabled>下载选中图层</button><button id="download-package" disabled>下载拆分包</button></div>
<div id="stage"><div id="empty"><strong>打开一个 UI 拆分包</strong><p>支持原图对照、图层显隐、单层查看与下载</p></div></div><div id="error" role="alert" hidden></div><div id="issues" hidden></div><div id="status" role="status">等待文件 · 不上传 · 不生成新素材</div></section></main>
<script type="module" src="/src/layer-viewer.ts"></script></body></html>
