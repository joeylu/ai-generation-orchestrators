name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AI_FRAME_ANIMATION_OFFLINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify tag matches package version
        run: python scripts/build_release_metadata.py --verify-tag "${GITHUB_REF_NAME}"
      - name: Install, test, and build
        run: |
          python -m pip install ".[test]" build
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m build
          python scripts/build_release_metadata.py --dist dist
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
