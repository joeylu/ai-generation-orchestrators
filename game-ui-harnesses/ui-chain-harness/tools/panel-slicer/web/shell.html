<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Slicer · 面板自适应工具</title></head>
<body>
  <header><a class="brand" href="/">PANEL SLICER <span>/ 面板自适应工具</span></a><div class="actions"><button id="open-png">打开 PNG</button><button id="export-png" class="primary">导出背景 PNG</button></div></header>
  <input id="png-file" type="file" accept="image/png,.png" hidden><input id="json-file" type="file" accept="application/json,.json" hidden>
  <main>
    <section class="source-panel card"><div class="section-heading"><h1>原始素材</h1><span id="source-size"></span></div><p class="hint">打开单张面板 PNG，自动适配边角。</p><div class="source-surround checker"><div id="source-stage"><img id="source-image" alt="当前 PNG 原图" draggable="false"><button class="cut vertical" data-side="left" aria-label="左切线" title="左右方向键调整 1 像素"><span>L</span></button><button class="cut horizontal" data-side="top" aria-label="上切线" title="上下方向键调整 1 像素"><span>T</span></button><button class="cut vertical" data-side="right" aria-label="右切线" title="左右方向键调整 1 像素"><span>R</span></button><button class="cut horizontal" data-side="bottom" aria-label="下切线" title="上下方向键调整 1 像素"><span>B</span></button></div></div><strong id="source-name">程序示例</strong><p class="hint">原图保持不变，右侧预览调整后的效果。</p></section>
    <section class="preview-panel card"><div class="section-heading"><h2>尺寸预览</h2><div class="actions"><button id="undo" title="撤销上一次修改">撤销</button><button id="redo" title="重做">重做</button></div></div><div class="presets"><button data-size="480,220">宽面板</button><button data-size="240,480">高面板</button><button data-size="320,320">方形</button></div><div id="preview-area" class="checker"><div id="preview-frame"><div id="canvas-host"></div><button id="resize" aria-label="拖动调整面板尺寸" title="拖动调整面板尺寸"></button></div></div><div class="preview-summary"><strong id="target-size"></strong></div><p class="hint">拖动右下角调整尺寸，满意后导出 PNG。</p></section>
    <aside class="inspector card"><h2>图片设置</h2><p class="hint">默认自动配置，无需填写切线和倍率。复杂素材会提示不支持，并保留当前预览。</p><fieldset><legend>面板尺寸</legend><div class="fields"><label>宽度<input data-field="width" type="number" min="24" max="4096" step="1"></label><label>高度<input data-field="height" type="number" min="24" max="4096" step="1"></label></div></fieldset><fieldset><legend>PNG 导出</legend><label>输出分辨率<select data-field="exportResolution"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><p id="export-size" class="hint"></p><p class="hint">按当前有效预览导出，保留透明背景。</p></fieldset><details id="advanced"><summary>高级设置</summary><label class="manual-option"><input id="manual-import" type="checkbox">手动导入（跳过自动判断）</label><fieldset><legend>四边切线 · 原图像素</legend><div class="fields" id="borders"><label>左 L<input data-field="left" type="number" min="0" step="1"></label><label>上 T<input data-field="top" type="number" min="0" step="1"></label><label>右 R<input data-field="right" type="number" min="0" step="1"></label><label>下 B<input data-field="bottom" type="number" min="0" step="1"></label></div></fieldset><fieldset><legend>显示</legend><label>素材密度<select data-field="density"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></label><label>边框倍率<input data-field="multiplier" type="number" min="0.125" max="16" step="0.125"></label><p class="hint">对应 Pixels Per Unit Multiplier，1 为默认。</p></fieldset><span id="border-summary"></span><div class="advanced-actions"><button id="open-json">打开配置 / 背景包</button><button id="save-json">保存配置</button><button id="save-package">导出背景包</button><button id="save-source">保存原始 PNG</button><a class="runtime-link" href="slice-runtime.html" target="_blank" rel="noopener">自适应验收</a></div><button id="restore" class="wide">恢复到当前有效参数</button></details></aside>
  </main><footer id="status" role="status">正在准备本地预览…</footer>
</body></html>
