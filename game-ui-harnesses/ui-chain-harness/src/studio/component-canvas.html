<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组件检视画布</title><style>*{box-sizing:border-box}body{margin:0;background:#11151a;color:#c8d0db;font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}button,select{font:inherit;color:inherit;background:#232930;border:1px solid #46515e;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#344139}button:focus-visible,select:focus-visible{outline:2px solid #b6e5c6;outline-offset:2px}button[aria-pressed=true]{background:#345040;color:#caefcf}header{height:49px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #343d48;background:#1b2026}header span{margin-left:auto;color:#99a8b7;font-size:10px}#workspace{position:absolute;inset:49px 0 0;display:flex}aside{width:165px;flex-shrink:0;overflow:auto;padding:14px 10px;border-right:1px solid #303944;background:#181d23}aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;margin-bottom:3px;font-size:11px}#viewport{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none;background-color:#111820;background-image:linear-gradient(#94c4e00c 1px,transparent 1px),linear-gradient(90deg,#94c4e00c 1px,transparent 1px);background-size:24px 24px}canvas{position:absolute;left:0;top:0;transform-origin:0 0;display:block}#status{position:absolute;left:20px;bottom:14px;pointer-events:none;color:#aab8c5;background:#182129d9;padding:5px 10px;border-radius:6px}.dialog-recovery{position:absolute;z-index:1;width:220px;text-align:center;color:#c8d0db;font-size:14px}.dialog-recovery p{margin:0 0 12px}.dialog-recovery button{background:#314a3c;border-color:#769c83;color:#d6f2df;font-size:14px;padding:9px 18px}#zoom{min-width:43px;text-align:center}@media(max-width:620px){aside{width:104px;padding:8px 4px}aside button{font-size:10px;padding:8px 5px}header{gap:4px;padding:8px}header span,header a{display:none}button{padding:7px}#status{font-size:10px;left:10px}}aside h3{font-size:12px;margin:18px 8px 6px;color:#b6e5c6}aside p{margin:8px;color:#aab8c5}#show-materials{min-height:36px}aside button{min-height:36px}@media(max-width:620px){header{height:88px;flex-wrap:wrap;align-content:center}#workspace{top:88px}aside h3{font-size:11px;margin:14px 4px 6px}aside button{min-height:44px}} </style><header><button id="fit">适配全部</button><button id="one">100%</button><button id="minus" aria-label="缩小">−</button><output id="zoom">—</output><button id="plus" aria-label="放大">＋</button><button id="hand" aria-pressed="false">平移</button><span>空白处滚轮缩放 · 空格 / 中键平移 · 组件内直接试玩</span></header><div id="workspace"><aside id="component-list" aria-label="定位组件"></aside><div id="viewport" tabindex="0" aria-label="组件预览画布"><p id="status" role="status">正在载入真实组件…</p></div></div><script type="module" src="/component-canvas.mjs"></script></html>
