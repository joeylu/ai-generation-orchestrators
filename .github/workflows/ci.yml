name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_filter:
        description: "Optional Playwright title filter for a diagnostic run; empty runs full CI"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ui-components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-ui-harnesses/ui-component-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: game-ui-harnesses/ui-component-harness/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/build-layer-viewer.mjs
      - run: npm test
      - run: npm run self-test
      # Contract probes import /src modules; npm test also checks the built CLI.
      - name: Run browser acceptance
        env:
          BROWSER_FILTER: ${{ inputs.browser_filter }}
        run: |
          if [ -n "$BROWSER_FILTER" ]; then
            npm run test:browser -- --grep "$BROWSER_FILTER"
          else
            npm run test:browser
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-browser-failure-evidence
          path: game-ui-harnesses/ui-component-harness/test-results/
          if-no-files-found: ignore

  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.browser_filter == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      AI_FRAME_ANIMATION_OFFLINE_TESTS: "1"
      PYTHONPATH: ${{ github.workspace }}/game-ui-harnesses/ui-decomposition-harness/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: game-ui-harnesses/ui-component-harness/package-lock.json
      - name: Build local component consumer for offline integration fixtures
        working-directory: game-ui-harnesses/ui-component-harness
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install independent Harness packages
        run: >-
          python -m pip install
          "./artwork-harnesses/image-background-removal-harness[test]"
          "./artwork-harnesses/video-sequence-harness/character[test]"
          "./game-ui-harnesses/ui-decomposition-harness[test,psd]"
      - name: Run offline fixtures and test doubles
        run: |
          python -m pip install -r game-ui-harnesses/ui-layer-harness/requirements.txt
          python -m unittest discover -s game-ui-harnesses/ui-layer-harness -p "test_*.py" -v
          python -m unittest discover -s artwork-harnesses/image-background-removal-harness/tests -p "test_*.py" -v
          python -m unittest discover -s artwork-harnesses/video-sequence-harness/character/tests -p "test_*.py" -v
          python -m unittest discover -s game-ui-harnesses/ui-decomposition-harness/tests -p "test_*.py" -v
          python -m unittest discover -s .github/repository-tests -p "test_*.py" -v
      - name: Check installed offline contract
        run: |
          ai-image-background-removal self-test
          ai-frame-animation self-test
          ai-ui-decomposition self-test
      - name: Check redacted doctor
        run: |
          ai-image-background-removal doctor
          ai-frame-animation doctor
          ai-ui-decomposition doctor

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --outdir dist artwork-harnesses/image-background-removal-harness
      - run: python -m build --outdir dist artwork-harnesses/video-sequence-harness/character
      - run: python -m build --outdir dist game-ui-harnesses/ui-decomposition-harness
      - run: python .github/release_tools/build_release_metadata.py --dist dist --component all
      - uses: actions/upload-artifact@v7
        with:
          name: ai-generation-orchestrators-dist
          path: dist/
          if-no-files-found: error

  dependency-audit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.browser_filter == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: >-
          python -m pip install
          ./artwork-harnesses/image-background-removal-harness
          ./artwork-harnesses/video-sequence-harness/character
          ./game-ui-harnesses/ui-decomposition-harness
          pip-audit
      - run: pip-audit
