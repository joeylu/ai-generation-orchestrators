name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      AI_FRAME_ANIMATION_OFFLINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install independent Harness packages
        run: >-
          python -m pip install
          "./artwork-harnesses/image-background-removal-harness[test]"
          "./artwork-harnesses/video-sequence-harness/character[test]"
      - name: Run offline fixtures and test doubles
        run: |
          python -m unittest discover -s artwork-harnesses/image-background-removal-harness/tests -p "test_*.py" -v
          python -m unittest discover -s artwork-harnesses/video-sequence-harness/character/tests -p "test_*.py" -v
          python -m unittest discover -s .github/repository-tests -p "test_*.py" -v
      - name: Check installed offline contract
        run: |
          ai-image-background-removal self-test
          ai-frame-animation self-test
      - name: Check redacted doctor
        run: |
          ai-image-background-removal doctor
          ai-frame-animation doctor

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --outdir dist artwork-harnesses/image-background-removal-harness
      - run: python -m build --outdir dist artwork-harnesses/video-sequence-harness/character
      - run: python .github/release_tools/build_release_metadata.py --dist dist --component all
      - uses: actions/upload-artifact@v7
        with:
          name: ai-frame-animation-dist
          path: dist/
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: >-
          python -m pip install
          ./artwork-harnesses/image-background-removal-harness
          ./artwork-harnesses/video-sequence-harness/character
          pip-audit
      - run: pip-audit
